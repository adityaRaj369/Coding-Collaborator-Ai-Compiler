name: Build and Deploy Server

on:
  push:
    branches: [ feat/docker-deployment ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ feat/docker-deployment ]
    paths:
      - 'server/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/docker-deployment'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # OPTION 1: Deploy to Google Cloud Run
      # ============================================
      - name: Deploy to Google Cloud Run
        if: vars.DEPLOY_TO == 'cloud-run' || vars.DEPLOY_TO == ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: coding-collaborator-server
          region: us-central1
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --timeout=3600
            --max-instances=100
            --set-env-vars="MONGO_URI=${{ secrets.MONGO_URI }},GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"
        env:
          secrets: |-
            GOOGLE_APPLICATION_CREDENTIALS=

      # ============================================
      # OPTION 2: Deploy to AWS ECS
      # ============================================
      - name: Configure AWS credentials
        if: vars.DEPLOY_TO == 'aws-ecs'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Amazon ECS
        if: vars.DEPLOY_TO == 'aws-ecs'
        run: |
          echo "Push image to ECR and update ECS service"
          # This requires additional setup - see README for detailed instructions

      # ============================================
      # OPTION 3: Deploy to DigitalOcean App Platform
      # ============================================
      - name: Deploy to DigitalOcean
        if: vars.DEPLOY_TO == 'digitalocean'
        run: |
          echo "Deploying to DigitalOcean via API"
          # This requires additional setup - see README for detailed instructions

      # ============================================
      # OPTION 4: Deploy via SSH to VPS
      # ============================================
      - name: Deploy to VPS via Docker Compose
        if: vars.DEPLOY_TO == 'vps'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'EOF'
            cd /app
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker-compose -f docker-compose.yml up -d
          EOF

      - name: Deployment Status
        run: echo "✅ Deployment completed successfully!"
